<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Vigilancia y Fatiga (PVT)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f4f6f9; }
    .container { width: 90%; max-width: 450px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    h2 { margin-bottom: 15px; color: #1e293b; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { font-size: 14px; color: #475569; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #94a3b8; }
    
    /* Zona interactiva de estímulo */
    #test-zone {
      width: 100%; height: 250px; border-radius: 10px; margin: 20px 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold; color: #fff; cursor: pointer; user-select: none;
    }
    .waiting { background-color: #64748b; } /* Gris - Espera */
    .active { background-color: #dc2626; }  /* Rojo - ¡TOCAR AHORA! */
    .early { background-color: #d97706; }   /* Naranja - Toco antes de tiempo */

    .hidden { display: none; }
    .results { text-align: left; margin-top: 15px; font-size: 14px; color: #334155; }
    .alert-box { padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 10px; text-align: center; }
    .alert-ok { background-color: #dcfce7; color: #15803d; }
    .alert-warning { background-color: #fef3c7; color: #b45309; }
    .alert-danger { background-color: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <h2>Control de Fatiga y Somnolencia</h2>

  <!-- Registro de Colaborador -->
  <div id="setup-section">
    <div class="form-group">
      <label for="worker-id">DNI / Código de Trabajador:</label>
      <input type="text" id="worker-id" placeholder="Ej. 70123456">
    </div>
    <button onclick="startAssessment()">Iniciar Evaluación</button>
  </div>

  <!-- Zona de la prueba -->
  <div id="test-section" class="hidden">
    <p id="instruction-text">Atento: presiona la pantalla en cuanto cambie a **ROJO**.</p>
    <div id="test-zone" class="waiting" onclick="handleTap()">
      Toca para iniciar
    </div>
    <p>Intento <span id="current-attempt">0</span> de <span id="total-attempts">5</span></p>
  </div>

  <!-- Resultados del test -->
  <div id="result-section" class="hidden">
    <h3>Resultado de la Evaluación</h3>
    <div id="status-alert" class="alert-box"></div>
    <div class="results">
      <p><strong>Tiempo Promedio de Reacción:</strong> <span id="avg-time"></span> ms</p>
      <p><strong>Anticipaciones (Falsos toques):</strong> <span id="early-taps"></span></p>
      <p><strong>Lapses (>500 ms):</strong> <span id="lapses-count"></span></p>
    </div>
    <br>
    <button onclick="resetApp()">Nueva Evaluación</button>
  </div>
</div>

<script>
  const TOTAL_ROUNDS = 5;
  let attempts = [];
  let currentRound = 0;
  let earlyTapsCount = 0;
  let startTime = 0;
  let timerId = null;
  let state = 'IDLE'; // IDLE, WAITING, READY

  function startAssessment() {
    const workerId = document.getElementById('worker-id').value.trim();
    if (!workerId) {
      alert('Por favor ingrese el DNI o código del colaborador.');
      return;
    }
    
    document.getElementById('setup-section').classList.add('hidden');
    document.getElementById('test-section').classList.remove('hidden');
    document.getElementById('total-attempts').innerText = TOTAL_ROUNDS;
    resetTestState();
  }

  function resetTestState() {
    currentRound = 0;
    attempts = [];
    earlyTapsCount = 0;
    nextRound();
  }

  function nextRound() {
    if (currentRound >= TOTAL_ROUNDS) {
      finishTest();
      return;
    }

    state = 'WAITING';
    const zone = document.getElementById('test-zone');
    zone.className = 'waiting';
    zone.innerText = 'Atento...';
    document.getElementById('current-attempt').innerText = currentRound + 1;

    // Intervalo aleatorio entre 2 y 4.5 segundos
    const randomDelay = Math.floor(Math.random() * 2500) + 2000;

    timerId = setTimeout(() => {
      state = 'READY';
      zone.className = 'active';
      zone.innerText = '¡PRESIONA AHORA!';
      startTime = Date.now();
    }, randomDelay);
  }

  function handleTap() {
    const zone = document.getElementById('test-zone');

    if (state === 'WAITING') {
      // Tocó demasiado pronto
      clearTimeout(timerId);
      earlyTapsCount++;
      zone.className = 'early';
      zone.innerText = '¡Demasiado pronto!';
      state = 'PENALTY';
      setTimeout(() => {
        nextRound();
      }, 1200);

    } else if (state === 'READY') {
      // Reacción correcta
      const reactionTime = Date.now() - startTime;
      attempts.push(reactionTime);
      currentRound++;
      zone.innerText = reactionTime + ' ms';
      state = 'IDLE';
      setTimeout(() => {
        nextRound();
      }, 1000);
    }
  }

  function finishTest() {
    document.getElementById('test-section').classList.add('hidden');
    document.getElementById('result-section').classList.remove('hidden');

    const sum = attempts.reduce((a, b) => a + b, 0);
    const avg = Math.round(sum / attempts.length);
    const lapses = attempts.filter(time => time > 500).length;

    document.getElementById('avg-time').innerText = avg;
    document.getElementById('early-taps').innerText = earlyTapsCount;
    document.getElementById('lapses-count').innerText = lapses;

    const alertBox = document.getElementById('status-alert');

    // Criterios de Evaluación
    if (avg <= 350 && lapses === 0 && earlyTapsCount <= 1) {
      alertBox.className = 'alert-box alert-ok';
      alertBox.innerText = 'APTO: Nivel de alerta óptimo.';
    } else if (avg <= 480 || lapses === 1) {
      alertBox.className = 'alert-box alert-warning';
      alertBox.innerText = 'PRECAUCIÓN: Fatiga Leve / Moderada. Monitorear.';
    } else {
      alertBox.className = 'alert-box alert-danger';
      alertBox.innerText = 'NO APTO: Fatiga Elevada. Iniciar protocolo de pausa/relevo.';
    }
  }

  function resetApp() {
    document.getElementById('worker-id').value = '';
    document.getElementById('result-section').classList.add('hidden');
    document.getElementById('setup-section').classList.remove('hidden');
  }
</script>

</body>
</html>
