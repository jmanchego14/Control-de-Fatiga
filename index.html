<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Atención y Evaluación Cognitiva - SST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; }
    .card { width: 92%; max-width: 480px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; border: 1px solid #334155; }
    h2 { font-size: 20px; margin-bottom: 15px; color: #38bdf8; }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { font-size: 13px; color: #94a3b8; font-weight: bold; }
    input { width: 100%; padding: 12px; margin-top: 6px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
    
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }

    /* Área interactiva */
    #stimulus-box {
      width: 100%; min-height: 220px; border-radius: 12px; margin: 20px 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; user-select: none; cursor: pointer; padding: 15px;
      transition: background 0.15s ease;
    }
    .bg-waiting { background-color: #334155; color: #94a3b8; }
    .bg-go { background-color: #16a34a; color: #ffffff; }
    .bg-nogo { background-color: #dc2626; color: #ffffff; }
    .bg-math { background-color: #d97706; color: #ffffff; }

    .hidden { display: none; }
    .status-badge { padding: 10px; border-radius: 8px; font-weight: bold; margin: 15px 0; font-size: 15px; }
    .badge-ok { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .badge-warn { background-color: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid #eab308; }
    .badge-danger { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-top: 15px; font-size: 13px; color: #cbd5e1; }
    .metrics-item { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
  </style>
</head>
<body>

<div class="card">
  <h2>Test de Atención Multiestímulo (PVT+)</h2>

  <!-- Paso 1: Ingreso -->
  <div id="step-setup">
    <div class="form-group">
      <label for="worker-id">DNI / Código de Colaborador:</label>
      <input type="text" id="worker-id" placeholder="Ingrese DNI...">
    </div>
    <button onclick="startTest()">Iniciar Evaluación</button>
  </div>

  <!-- Paso 2: Zona de Estímulos -->
  <div id="step-test" class="hidden">
    <p style="font-size: 14px; color: #94a3b8;">Ensayo <span id="current-step">0</span> de <span id="total-steps">10</span></p>
    <div id="stimulus-box" class="bg-waiting" onclick="handleTouch()">
      <span id="stimulus-text">Atento a la pantalla...</span>
    </div>
    <p id="instruction-sub" style="font-size: 12px; color: #64748b;">Lee atentamente las instrucciones en cada cambio.</p>
  </div>

  <!-- Paso 3: Resultados -->
  <div id="step-results" class="hidden">
    <h3>Resultado Diagnóstico</h3>
    <div id="result-badge" class="status-badge"></div>
    
    <div class="metrics-grid">
      <div class="metrics-item"><strong>Reacción Promedio:</strong> <br><span id="m-avg">0</span> ms</div>
      <div class="metrics-item"><strong>Inhibición (Errores No-Go):</strong> <br><span id="m-nogo-err">0</span></div>
      <div class="metrics-item"><strong>Fallos de Cálculo/Lógica:</strong> <br><span id="m-logic-err">0</span></div>
      <div class="metrics-item"><strong>Lapses / Micro-sueños (>550ms):</strong> <br><span id="m-lapses">0</span></div>
    </div>
    <br>
    <button onclick="resetApp()">Realizar Nuevo Test</button>
  </div>
</div>

<script>
  // Configuración de la prueba
  const TOTAL_TRIALS = 10;
  let currentTrial = 0;
  let trialData = [];
  let startTime = 0;
  let timerId = null;
  let currentState = 'IDLE'; // IDLE, WAITING, ACTIVE_GO, ACTIVE_NOGO, ACTIVE_EVEN
  let currentTarget = null;

  let metrics = {
    reactionTimes: [],
    noGoErrors: 0,
    logicErrors: 0,
    earlyTaps: 0,
    lapses: 0
  };

  function startTest() {
    const id = document.getElementById('worker-id').value.trim();
    if (!id) return alert('Por favor ingrese el DNI del trabajador.');

    document.getElementById('step-setup').classList.add('hidden');
    document.getElementById('step-test').classList.remove('hidden');
    document.getElementById('total-steps').innerText = TOTAL_TRIALS;
    
    currentTrial = 0;
    metrics = { reactionTimes: [], noGoErrors: 0, logicErrors: 0, earlyTaps: 0, lapses: 0 };
    runNextTrial();
  }

  function runNextTrial() {
    if (currentTrial >= TOTAL_TRIALS) {
      evaluateResults();
      return;
    }

    currentState = 'WAITING';
    const box = document.getElementById('stimulus-box');
    box.className = 'bg-waiting';
    box.innerText = 'Espere el estímulo...';
    document.getElementById('current-step').innerText = currentTrial + 1;

    // Demora aleatoria entre 1.8 y 3.5 segundos
    const delay = Math.floor(Math.random() * 1700) + 1800;

    timerId = setTimeout(() => {
      triggerStimulus();
    }, delay);
  }

  function triggerStimulus() {
    const types = ['GO', 'NO_GO', 'EVEN_NUMBER', 'ODD_NUMBER'];
    // Selección aleatoria del tipo de estímulo
    const selectedType = types[Math.floor(Math.random() * types.length)];
    const box = document.getElementById('stimulus-box');
    startTime = Date.now();

    if (selectedType === 'GO') {
      currentState = 'ACTIVE_GO';
      box.className = 'bg-go';
      box.innerHTML = '¡TOCA AHORA!';
    } 
    else if (selectedType === 'NO_GO') {
      currentState = 'ACTIVE_NOGO';
      box.className = 'bg-nogo';
      box.innerHTML = '🛑 ¡NO TOCAR! 🛑';
      
      // Si pasan 1.8s sin tocar, se considera una inhibición exitosa
      timerId = setTimeout(() => {
        if (currentState === 'ACTIVE_NOGO') {
          currentTrial++;
          runNextTrial();
        }
      }, 1800);
    } 
    else if (selectedType === 'EVEN_NUMBER') { // Número Par -> SI TOCAR
      currentState = 'ACTIVE_EVEN';
      const num = [2, 4, 6, 8][Math.floor(Math.random() * 4)];
      box.className = 'bg-math';
      box.innerHTML = `Presiona solo si es PAR:<br><br><span style="font-size:40px">${num}</span>`;
    } 
    else if (selectedType === 'ODD_NUMBER') { // Número Impar -> NO TOCAR
      currentState = 'ACTIVE_ODD';
      const num = [1, 3, 5, 7][Math.floor(Math.random() * 4)];
      box.className = 'bg-math';
      box.innerHTML = `Presiona solo si es PAR:<br><br><span style="font-size:40px">${num}</span>`;
      
      timerId = setTimeout(() => {
        if (currentState === 'ACTIVE_ODD') {
          currentTrial++;
          runNextTrial();
        }
      }, 1800);
    }
  }

  function handleTouch() {
    const elapsed = Date.now() - startTime;

    if (currentState === 'WAITING') {
      clearTimeout(timerId);
      metrics.earlyTaps++;
      const box = document.getElementById('stimulus-box');
      box.className = 'bg-nogo';
      box.innerText = '¡Anticipación! Espera la señal.';
      currentState = 'PENALTY';
      setTimeout(runNextTrial, 1200);
    } 
    else if (currentState === 'ACTIVE_GO') {
      metrics.reactionTimes.push(elapsed);
      if (elapsed > 550) metrics.lapses++;
      currentTrial++;
      runNextTrial();
    } 
    else if (currentState === 'ACTIVE_NOGO') {
      clearTimeout(timerId);
      metrics.noGoErrors++; // Error por falta de inhibición
      currentTrial++;
      runNextTrial();
    } 
    else if (currentState === 'ACTIVE_EVEN') {
      metrics.reactionTimes.push(elapsed);
      if (elapsed > 550) metrics.lapses++;
      currentTrial++;
      runNextTrial();
    } 
    else if (currentState === 'ACTIVE_ODD') {
      clearTimeout(timerId);
      metrics.logicErrors++; // Tocó cuando era Impar
      currentTrial++;
      runNextTrial();
    }
  }

  function evaluateResults() {
    document.getElementById('step-test').classList.add('hidden');
    document.getElementById('step-results').classList.remove('hidden');

    const sum = metrics.reactionTimes.reduce((a, b) => a + b, 0);
    const avgTime = metrics.reactionTimes.length > 0 ? Math.round(sum / metrics.reactionTimes.length) : 0;

    document.getElementById('m-avg').innerText = avgTime;
    document.getElementById('m-nogo-err').innerText = metrics.noGoErrors;
    document.getElementById('m-logic-err').innerText = metrics.logicErrors;
    document.getElementById('m-lapses').innerText = metrics.lapses;

    const badge = document.getElementById('result-badge');

    // Criterios de Evaluación Cognitiva de Fatiga
    if (avgTime <= 420 && metrics.noGoErrors === 0 && metrics.logicErrors === 0 && metrics.lapses === 0) {
      badge.className = 'status-badge badge-ok';
      badge.innerText = 'APTO: Excelente nivel de atención e inhibición.';
    } else if (avgTime <= 520 && (metrics.noGoErrors + metrics.logicErrors) <= 1) {
      badge.className = 'status-badge badge-warn';
      badge.innerText = 'OBSERVADO: Fatiga moderada / Desatención leve.';
    } else {
      badge.className = 'status-badge badge-danger';
      badge.innerText = 'NO APTO: Alto riesgo de fatiga / Lapsos atencionales críticos.';
    }
  }

  function resetApp() {
    document.getElementById('worker-id').value = '';
    document.getElementById('step-results').classList.add('hidden');
    document.getElementById('step-setup').classList.remove('hidden');
  }
</script>

</body>
</html>
