<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Fatiga y Atención - SST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0f172a; color: #f8fafc; }
    .card { width: 92%; max-width: 500px; background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; border: 1px solid #334155; }
    h2 { font-size: 20px; margin-bottom: 15px; color: #38bdf8; }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { font-size: 13px; color: #94a3b8; font-weight: bold; }
    input { width: 100%; padding: 12px; margin-top: 6px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 16px; outline: none; }
    
    button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.98); }

    /* Área interactiva */
    #stimulus-box {
      width: 100%; min-height: 220px; border-radius: 12px; margin: 20px 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; user-select: none; cursor: pointer; padding: 15px;
      transition: background 0.15s ease;
    }
    .bg-waiting { background-color: #334155; color: #94a3b8; }
    .bg-go { background-color: #16a34a; color: #ffffff; }
    .bg-nogo { background-color: #dc2626; color: #ffffff; }
    .bg-math { background-color: #d97706; color: #ffffff; }

    .hidden { display: none; }
    .status-badge { padding: 12px; border-radius: 8px; font-weight: bold; margin: 15px 0; font-size: 16px; text-transform: uppercase; }
    
    /* Colores para los 5 niveles */
    .badge-optimo { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-bajo { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-medio { background-color: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid #eab308; }
    .badge-alto { background-color: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid #f97316; }
    .badge-critico { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-top: 15px; font-size: 13px; color: #cbd5e1; }
    .metrics-item { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
    .recommendation-box { background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px; margin-top: 15px; text-align: left; font-size: 13px; color: #e2e8f0; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body>

<div class="card">
  <h2>Test de Fatiga y Atención - SST</h2>

  <!-- Paso 1: Ingreso -->
  <div id="step-setup">
    <div class="form-group">
      <label for="worker-id">DNI / Código de Colaborador:</label>
      <input type="text" id="worker-id" placeholder="Ingrese DNI...">
    </div>
    <button onclick="startTest()">Iniciar Evaluación</button>
  </div>

  <!-- Paso 2: Zona de Estímulos -->
  <div id="step-test" class="hidden">
    <p style="font-size: 14px; color: #94a3b8;">Ensayo <span id="current-step">0</span> de <span id="total-steps">10</span></p>
    <div id="stimulus-box" class="bg-waiting" onclick="handleTouch()">
      <span id="stimulus-text">Atento a la pantalla...</span>
    </div>
    <p id="instruction-sub" style="font-size: 12px; color: #64748b;">Responde según la regla del estímulo.</p>
  </div>

  <!-- Paso 3: Resultados -->
  <div id="step-results" class="hidden">
    <h3>Resultado de Evaluación</h3>
    <div id="result-badge" class="status-badge"></div>
    
    <div class="metrics-grid">
      <div class="metrics-item"><strong>Reacción Promedio:</strong> <br><span id="m-avg">0</span> ms</div>
      <div class="metrics-item"><strong>Errores de Inhibición:</strong> <br><span id="m-nogo-err">0</span></div>
      <div class="metrics-item"><strong>Fallos Lógicos:</strong> <br><span id="m-logic-err">0</span></div>
      <div class="metrics-item"><strong>Anticipaciones:</strong> <br><span id="m-early">0</span></div>
    </div>

    <div class="recommendation-box">
      <strong>Recomendación Operativa SST:</strong>
      <p id="recommendation-text" style="margin-top: 5px;"></p>
    </div>
    <br>
    <button onclick="resetApp()">Nueva Evaluación</button>
  </div>
</div>

<script>
  const TOTAL_TRIALS = 10;
  let currentTrial = 0;
  let startTime = 0;
  let timerId = null;
  let currentState = 'IDLE';

  let metrics = {
    reactionTimes: [],
    noGoErrors: 0,
    logicErrors: 0,
    earlyTaps: 0
  };

  function startTest() {
    const id = document.getElementById('worker-id').value.trim();
    if (!id) return alert('Por favor ingrese el DNI del trabajador.');

    document.getElementById('step-setup').classList.add('hidden');
    document.getElementById('step-test').classList.remove('hidden');
    document.getElementById('total-steps').innerText = TOTAL_TRIALS;
    
    currentTrial = 0;
    metrics = { reactionTimes: [], noGoErrors: 0, logicErrors: 0, earlyTaps: 0 };
    runNextTrial();
  }

  function runNextTrial() {
    if (currentTrial >= TOTAL_TRIALS) {
      evaluateResults();
      return;
    }

    currentState = 'WAITING';
    const box = document.getElementById('stimulus-box');
    box.className = 'bg-waiting';
    box.innerText = 'Espere el estímulo...';
    document.getElementById('current-step').innerText = currentTrial + 1;

    const delay = Math.floor(Math.random() * 1500) + 1500;
    timerId = setTimeout(triggerStimulus, delay);
  }

  function triggerStimulus() {
    const types = ['GO', 'NO_GO', 'EVEN_NUMBER', 'ODD_NUMBER'];
    const selectedType = types[Math.floor(Math.random() * types.length)];
    const box = document.getElementById('stimulus-box');
    startTime = Date.now();

    if (selectedType === 'GO') {
      currentState = 'ACTIVE_GO';
      box.className = 'bg-go';
      box.innerHTML = '¡TOCA AHORA!';
    } 
    else if (selectedType === 'NO_GO') {
      currentState = 'ACTIVE_NOGO';
      box.className = 'bg-nogo';
      box.innerHTML = '🛑 ¡NO TOCAR! 🛑';
      
      timerId = setTimeout(() => {
        if (currentState === 'ACTIVE_NOGO') {
          currentTrial++;
          runNextTrial();
        }
      }, 2000);
    } 
    else if (selectedType === 'EVEN_NUMBER') {
      currentState = 'ACTIVE_EVEN';
      const num = [2, 4, 6, 8][Math.floor(Math.random() * 4)];
      box.className = 'bg-math';
      box.innerHTML = `Presiona solo si es PAR:<br><br><span style="font-size:36px">${num}</span>`;
    } 
    else if (selectedType === 'ODD_NUMBER') {
      currentState = 'ACTIVE_ODD';
      const num = [1, 3, 5, 7][Math.floor(Math.random() * 4)];
      box.className = 'bg-math';
      box.innerHTML = `Presiona solo si es PAR:<br><br><span style="font-size:36px">${num}</span>`;
      
      timerId = setTimeout(() => {
        if (currentState === 'ACTIVE_ODD') {
          currentTrial++;
          runNextTrial();
        }
      }, 2000);
    }
  }

  function handleTouch() {
    const elapsed = Date.now() - startTime;

    if (currentState === 'WAITING') {
      clearTimeout(timerId);
      metrics.earlyTaps++;
      const box = document.getElementById('stimulus-box');
      box.className = 'bg-nogo';
      box.innerText = '¡Anticipación! Cuidado.';
      currentState = 'PENALTY';
      setTimeout(runNextTrial, 1200);
    } 
    else if (currentState === 'ACTIVE_GO' || currentState === 'ACTIVE_EVEN') {
      metrics.reactionTimes.push(elapsed);
      currentTrial++;
      runNextTrial();
    } 
    else if (currentState === 'ACTIVE_NOGO') {
      clearTimeout(timerId);
      metrics.noGoErrors++;
      currentTrial++;
      runNextTrial();
    } 
    else if (currentState === 'ACTIVE_ODD') {
      clearTimeout(timerId);
      metrics.logicErrors++;
      currentTrial++;
      runNextTrial();
    }
  }

  function evaluateResults() {
    document.getElementById('step-test').classList.add('hidden');
    document.getElementById('step-results').classList.remove('hidden');

    const sum = metrics.reactionTimes.reduce((a, b) => a + b, 0);
    const avgTime = metrics.reactionTimes.length > 0 ? Math.round(sum / metrics.reactionTimes.length) : 0;

    document.getElementById('m-avg').innerText = avgTime || 0;
    document.getElementById('m-nogo-err').innerText = metrics.noGoErrors;
    document.getElementById('m-logic-err').innerText = metrics.logicErrors;
    document.getElementById('m-early').innerText = metrics.earlyTaps;

    const badge = document.getElementById('result-badge');
    const recText = document.getElementById('recommendation-text');

    // Nuevos Umbrales Configurados
    if (avgTime > 0 && avgTime < 800) {
      badge.className = 'status-badge badge-optimo';
      badge.innerText = 'Nivel: Óptimo';
      recText.innerText = 'Colaborador con excelente tiempo de respuesta. Autorizado para todo tipo de labores operativas y de alto riesgo.';
    } 
    else if (avgTime >= 800 && avgTime < 1000) {
      badge.className = 'status-badge badge-bajo';
      badge.innerText = 'Nivel: Fatiga Baja';
      recText.innerText = 'Atención normal dentro de parámetros esperados. Puede continuar con sus tareas habituales bajo supervisión regular.';
    } 
    else if (avgTime >= 1000 && avgTime < 1300) {
      badge.className = 'status-badge badge-medio';
      badge.innerText = 'Nivel: Fatiga Media';
      recText.innerText = 'Se detectan indicios moderados de cansancio. Se recomienda una pausa activa de 10 minutos o rotación breve antes de tareas críticas.';
    } 
    else if (avgTime >= 1300 && avgTime <= 2000) {
      badge.className = 'status-badge badge-alto';
      badge.innerText = 'Nivel: Fatiga Alto';
      recText.innerText = 'RESTRINGIR temporalmente. No asignar trabajos en altura, espacio confinado u operación de equipos pesados hasta nueva evaluación.';
    } 
    else {
      badge.className = 'status-badge badge-critico';
      badge.innerText = 'Nivel: Crítico';
      recText.innerText = 'ALERTA DE SEGURIDAD. El colaborador presenta retraso severo en reflejos (>2000ms). Derivar inmediatamente al tópico médico y suspender labores operativas.';
    }
  }

  function resetApp() {
    document.getElementById('worker-id').value = '';
    document.getElementById('step-results').classList.add('hidden');
    document.getElementById('step-setup').classList.remove('hidden');
  }
</script>

</body>
</html>
